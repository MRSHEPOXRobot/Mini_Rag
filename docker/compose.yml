# 8.3-noble docker pull mongo:8.3-noble
services:
  mongodb:
    image: mongo:8.3-noble

    container_name: mongodb

    ports:
      - "27007:27017"

    volumes:
      - mongodata:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD} # هيروح يبص على ال .env ويأخد القيمة منه

    networks:
      - backend

    restart: always

networks:
  backend:

volumes:
  mongodata:
